name: Sync to Gitee

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: [dramaclaw-ce-build]
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup task-local SSH key
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/gitee-ssh"
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/gitee-ssh/key"
          ssh-keyscan gitee.com > "$RUNNER_TEMP/gitee-ssh/known_hosts"
          # Keep the existing keepalive and retry behavior without changing ~/.ssh.
          cat > "$RUNNER_TEMP/gitee-ssh/config" <<EOF
          Host gitee.com
            IdentityFile "$RUNNER_TEMP/gitee-ssh/key"
            UserKnownHostsFile "$RUNNER_TEMP/gitee-ssh/known_hosts"
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          printf 'GIT_SSH_COMMAND=ssh -F "%s/gitee-ssh/config"\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Push to Gitee
        run: |
          # Checkout preserves .git/config on a persistent runner.
          if git remote get-url gitee > /dev/null 2>&1; then
            git remote set-url gitee git@gitee.com:dramaclaw/dramaclaw.git
          else
            git remote add gitee git@gitee.com:dramaclaw/dramaclaw.git
          fi
          for attempt in 1 2 3; do
            if git push gitee --all --force && git push gitee --tags --force; then
              exit 0
            fi
            echo "push attempt ${attempt} failed, retrying in 30s..."
            sleep 30
          done
          echo "all push attempts failed"
          exit 1

      - name: Remove task-local SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/gitee-ssh"
