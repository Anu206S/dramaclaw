name: secret-scan

# SECRET-15：CI secret-scan 门。命中即 exit 1，作为合入前必过门。
# 直接装 gitleaks 二进制运行（不用 gitleaks-action，规避 org 私仓的 license 要求）。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: [dramaclaw-ce-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 取完整历史，但仅扫描当前 SHA 的可达提交

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ci-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ci-tools" gitleaks
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ci-tools/gitleaks" version

      - name: Scan reachable git history
        run: gitleaks git . --log-opts="${{ github.sha }}" -c .gitleaks.toml --redact --no-banner --exit-code 1
