name: release-images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 release tag(如 v1.0.2)"
        required: true
        type: string
      push_latest:
        description: "同时更新 latest tag(重建旧版本时保持关闭)"
        type: boolean
        default: false

permissions:
  contents: read

# release 事件取 tag 名(github.ref_name),手动触发取输入的 tag。
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  backend:
    runs-on: [dramaclaw-ce-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - name: Set up persistent Linux builder
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ runner.name }}
          buildkitd-flags: --allow-insecure-entitlement network.host
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
            memory=3g
            memory-swap=3g
            cpu-quota=400000
            cpu-period=100000
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.lingshan.ai"]
            [worker.oci]
              max-parallelism = 1
              gc = true
              reservedSpace = "10GB"
              maxUsedSpace = "100GB"
              minFreeSpace = "50GB"
          keep-state: true
          cache-binary: false

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: claymorelab/dramaclaw
          # release: latest=auto(prerelease 不推 latest);手动触发由 push_latest 决定,
          # 默认 false —— 重建历史版本时避免把 latest 回退到旧版。
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          flavor: |
            latest=${{ github.event_name == 'release' && 'auto' || (inputs.push_latest && 'true' || 'false') }}
      - uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    runs-on: [dramaclaw-ce-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - name: Set up persistent Linux builder
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ runner.name }}
          buildkitd-flags: --allow-insecure-entitlement network.host
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
            memory=3g
            memory-swap=3g
            cpu-quota=400000
            cpu-period=100000
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.lingshan.ai"]
            [worker.oci]
              max-parallelism = 1
              gc = true
              reservedSpace = "10GB"
              maxUsedSpace = "100GB"
              minFreeSpace = "50GB"
          keep-state: true
          cache-binary: false

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: claymorelab/dramaclaw-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          flavor: |
            latest=${{ github.event_name == 'release' && 'auto' || (inputs.push_latest && 'true' || 'false') }}
      - uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_APP_VERSION=${{ env.RELEASE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
