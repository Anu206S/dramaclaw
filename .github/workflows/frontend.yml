name: frontend

# 前端 CI。与 frontend/Dockerfile 一致：pnpm（packageManager 锁 11.5.0）+ node 22。
# 跑「编译 + 类型检查」(pnpm build = tsc -b && vite build) 与单元测试 (vitest)。
# 仅在前端相关文件变更时触发，避免无关改动空跑。

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build-test:
    runs-on: [dramaclaw-ce-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build (tsc typecheck + vite build)
        run: pnpm build
      - name: Unit tests (vitest)
        run: pnpm test --maxWorkers=4
      - name: Set up bounded PR builder
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ runner.name }}-pr-validation
          buildkitd-flags: --allow-insecure-entitlement network.host
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
            memory=3g
            memory-swap=3g
            cpu-quota=400000
            cpu-period=100000
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.lingshan.ai"]
            [worker.oci]
              max-parallelism = 1
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "20GB"
              minFreeSpace = "50GB"
          keep-state: true
          cache-binary: false

      - name: Validate rendered Nginx configuration
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker buildx build --builder "$BUILDER" --target nginx-config-test --file Dockerfile .
